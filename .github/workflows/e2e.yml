name: E2E smoke tests (Playwright)

# 2026-08-22 総合レビュー対応（検証記録は memory/general-review-2026-08-22.md）:
# config系(next.config.ts/tsconfig.json/vercel.json) + 自身のパスを paths に追加。
# blog-ci.yml と同じ理由（過去に config だけの変更で CI が非発火だった実例が3回ある）。
on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/e2e/**'
      - 'frontend/playwright.config.ts'
      - 'frontend/next.config.ts'
      - 'frontend/tsconfig.json'
      - 'frontend/vercel.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

# 最小権限（診断④ 2026-08-20・W-3）: このWFはリポジトリへ書き込まない。
permissions:
  contents: read

jobs:
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 本番ビルドは blog-ci.yml（同じ frontend/src/** で発火）が type-check/test と一緒に行う。
      # ここで build しても playwright.config.ts の webServer は `npm run dev` を起動するため
      # 成果物は使われない（＝二重ビルドで CI 時間を捨てるだけ）ので、build ステップは持たない。
      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
