name: Check blend weights freeze integrity

# 2026-08-22 重み凍結（外部レビュー討議 plan/FORECAST_FREEZE_DEBATE_FINDINGS.md F-5）:
# blend_weights の自動更新を凍結した後、配信ファイル accuracy/blend_weights.json
# （oriental/ml/forecast_service.py が読む canonical）が本当に1バイトも変わっていないかを
# score_forecasts.py 自身の成否とは別経路で監視する。score ジョブが「成功」を返しても、
# canonical の中身が変わっていれば凍結は破られている——「存在する」だけでは別内容への
# 上書きが緑になってしまうため、SHA-256 の不変性そのものを見る（判定ロジックは
# scripts/monitor/check_blend_weights_freeze.py、テストは
# tests/test_monitor_blend_weights_freeze.py）。
#
# 通常実行（schedule）は read-only。復元（--restore）は workflow_dispatch の
# 明示入力からのみ実行され、schedule からは絶対に渡らない（自動復元はしない設計）。
#
# 頻度は6時間毎。CLAUDE.md 罠#5: GitHub Actions の schedule 間引きは10分毎のような
# 高頻度cron固有の問題で、日次/週次相当の低頻度cronは実測で発火欠落ゼロだった。
# 6時間毎はその中間だが、間引かれても数時間の遅延で済み、凍結監視としては十分な頻度。
#
# 【反響の抑制 / 2026-09-18 に恒久化】
# Supabase が止まっているあいだ、Storage を読むこの監視は必ず赤になり6時間毎に失敗メールが
# 出る。このWFは**反響**側＝上流が死んでいれば巻き添えで赤くなるだけで、鳴っても新しい情報は
# 増えない。そこで先頭に scripts/monitor/quota_pause.py を置き（env に QUOTA_GATE_ALWAYS: "1"）、
# 「上流が止まっている署名」を観測している間だけ後続ステップをスキップして成功で終える。
# 署名は HTTP 402 と Supabase ホストの名前解決失敗の2つだけで、タイムアウト・5xx・401/403
# では止めない。上流が戻れば次の実行から自動で通常運転に戻る（人手の復旧作業は不要）。
# **一次信号は別**: site-down-watch.yml（利用者にデータが出ていない）と
# check-collection-heartbeat.yml（収集が止まった）にはゲート自体が無く、必ず鳴る。
# なお凍結の実体は Storage 上のファイルなので、止まっているあいだ hash が変わることはない
# （上流が死んでいれば読み取りも書き込みも通らない）。見張れない期間があるだけで、見逃しは増えない。
# 手動実行（workflow_dispatch）は止まりません。手で回したときは必ず本体が動きます。

on:
  schedule:
    - cron: "23 */6 * * *" # 6時間毎（00:23 / 06:23 / 12:23 / 18:23 UTC）。他cronとの秒単位衝突を避けるためオフセット
  workflow_dispatch:
    inputs:
      restore:
        description: "true にすると検証付きで canonical を最新バックアップ世代から復元する（通常は false のまま）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      detail: ${{ steps.check.outputs.detail }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 上流が止まっている間だけ反響を抑えるゲート（2026-09-18 恒久化）────────
      # paused=true になるのは「上流が止まっている署名（402 / ホスト名の解決失敗）を
      # 観測した」ときだけ。それ以外はすべて paused=false ＝ 従来どおり監視が鳴る。
      # 判定は quota_pause.py 側にあり、このスクリプトは常に exit 0。
      - name: Quota pause gate
        id: quota_gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # このWFは**反響**側（上流が死んでいれば必ず巻き添えで赤くなる）。解除日に関係なく、
          # 上流が止まっている署名を観測している間は抑制する（2026-09-18 に恒久化）。
          # 一次信号（site-down-watch / check-collection-heartbeat）にはゲート自体が無い。
          QUOTA_GATE_ALWAYS: "1"
          # 日付モード用。QUOTA_GATE_ALWAYS が効いている間は参照されない。
          OPS_QUOTA_PAUSE_UNTIL: ${{ vars.OPS_QUOTA_PAUSE_UNTIL }}
          # 手動実行を絶対に止めないための入力（2026-09-11 追加）。手で回すのは
          # 「今どうなっているか自分の目で確かめたい」ときなので、ここでゲートに
          # 黙ってスキップされると確かめる手段そのものが消える。ゲート側は
          # この値が workflow_dispatch なら無条件で paused=false を返す。
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/monitor/quota_pause.py

      - name: Check blend_weights freeze integrity
        id: check
        if: steps.quota_gate.outputs.paused != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORECAST_MODEL_BUCKET: ${{ vars.FORECAST_MODEL_BUCKET }}
        # 判定/復元ロジックの実体は scripts/monitor/check_blend_weights_freeze.py（stdlib のみ）。
        # --restore は workflow_dispatch で restore=true を明示したときだけ渡す。
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.restore }}" = "true" ]; then
            echo "::notice::--restore で実行します（workflow_dispatch 明示指定）"
            python3 scripts/monitor/check_blend_weights_freeze.py --restore
          else
            python3 scripts/monitor/check_blend_weights_freeze.py
          fi

  notify-on-failure:
    needs: [check]
    if: failure()
    uses: ./.github/workflows/notify-on-failure.yml
    secrets: inherit
    with:
      workflow_label: "blend_weights 凍結監視"
      custom_body: |
        ⚠️ blend_weights の凍結が破られたか、監視/復元ジョブ自体が失敗した可能性があります。
        ${{ needs.check.outputs.detail }}
