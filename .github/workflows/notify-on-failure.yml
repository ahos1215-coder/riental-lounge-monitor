# 他ワークフローから workflow_call で呼び出す（単体では実行しない）
name: Notify on failure (reusable)

on:
  workflow_call:
    inputs:
      workflow_label:
        description: "通知に表示するワークフロー名"
        required: true
        type: string
      custom_body:
        description: "指定時はこの本文を通知する（失敗メッセージの代わり）。run URL は自動で追記。"
        required: false
        type: string
        default: ""

# 最小権限（診断④ 2026-08-20・W-3）: このWFはリポジトリへ書き込まない。
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Post webhook (Slack or Discord)
        env:
          WEBHOOK_URL: ${{ secrets.OPS_NOTIFY_WEBHOOK_URL }}
          WEBHOOK_TYPE: ${{ vars.OPS_NOTIFY_WEBHOOK_TYPE }}
          LABEL: ${{ inputs.workflow_label }}
          CUSTOM_BODY: ${{ inputs.custom_body }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "OPS_NOTIFY_WEBHOOK_URL が未設定のため通知をスキップします。"
            exit 0
          fi
          TYPE="${WEBHOOK_TYPE:-slack}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "${CUSTOM_BODY// }" ]; then
            MSG="${CUSTOM_BODY}"$'\n'"run: ${RUN_URL}"
          else
            MSG="GitHub Actions 失敗: ${LABEL}"$'\n'"repo: ${GITHUB_REPOSITORY}"$'\n'"ref: ${GITHUB_REF}"$'\n'"run: ${RUN_URL}"
          fi
          if [ "$TYPE" = "discord" ]; then
            PAYLOAD=$(jq -n --arg c "$MSG" '{content: $c}')
          else
            PAYLOAD=$(jq -n --arg t "$MSG" '{text: $t}')
          fi
          # 2026-08-22 総合レビュー対応: 従来は POST の結果を見ておらず、Webhook 側の
          # エラー（URL失効・レート制限・形式不一致等）が起きても本 WF は緑のまま終わり、
          # 「失敗通知が届いていない」ことに誰も気付けなかった（fail-open）。
          # URL 未設定時の skip（直上の分岐、exit 0）は意図的な opt-in 設計として現状維持し、
          # ここでは「設定済みだが送信に失敗した」場合だけを検問する（fail-closed）。
          HTTP_CODE=$(curl -sS -o /tmp/notify_resp.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL")
          case "$HTTP_CODE" in
            2??) echo "notify webhook ok (HTTP ${HTTP_CODE})" ;;
            *)
              cat /tmp/notify_resp.txt 2>/dev/null || true
              echo "::error::notify webhook failed: HTTP ${HTTP_CODE}"
              exit 1
              ;;
          esac
