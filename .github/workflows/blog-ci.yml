name: blog-ci

# 2026-08-22 総合レビュー対応（検証記録は memory/general-review-2026-08-22.md）:
# next.config.ts / tsconfig.json / vercel.json / 自身のパスを paths に追加。
# これらだけを変更した過去のコミット（例: vercel.json 単独コミット）は実際にこの CI が
# 非発火だった（実害はたまたま無し）。python-ci.yml は既に自身のパスを含めており
# 非対称だったので揃える。
on:
  pull_request:
    paths:
      - 'frontend/content/blog/**'
      - 'frontend/content/facts/public/**'
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/next.config.ts'
      - 'frontend/tsconfig.json'
      - 'frontend/vercel.json'
      - '.github/workflows/blog-ci.yml'
  push:
    paths:
      - 'frontend/content/blog/**'
      - 'frontend/content/facts/public/**'
      - 'frontend/src/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/next.config.ts'
      - 'frontend/tsconfig.json'
      - 'frontend/vercel.json'
      - '.github/workflows/blog-ci.yml'

# 最小権限（診断④ 2026-08-20・W-3）: このWFはリポジトリへ書き込まない。
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run test
      - run: npm run build