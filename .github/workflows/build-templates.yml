name: Build forecast v2 templates

# v2 SHADOW パイプラインの「唯一の」テンプレ再生成コマンド (scripts/build_templates.py)。
# 店×夜タイプ(L/M/H)の夜シェイプ×スケールを直近13週の実測から作り、Storage の
# forecast/templates_v2.json に1本アップロードする。snapshot_forecasts.py が毎晩これを
# 読んで A スナップショットと並べて v2 予測を記録し、score_forecasts.py が両者を採点する。
# 本番配信 (oriental/ml/forecast_service.py) は一切触らない。
# スコアリング(06:10 JST)の後に走らせるため 07:30 JST に固定。詳細は plan/FORECAST_V2.md。
#
# 【反響の抑制 / 2026-09-18 に恒久化】Supabase が止まっている間、このジョブは必ず落ちて
# 失敗メールを量産する（docs/INCIDENT_2026-09-05_SUPABASE_QUOTA.md）。このWFは**反響**側＝
# 上流が死んでいれば巻き添えで赤くなるだけで、鳴っても新しい情報は増えない。そこで先頭の
# "Quota pause gate"（scripts/monitor/quota_pause.py ＋ env の QUOTA_GATE_ALWAYS: "1"）が
# 「上流が止まっている署名」を観測している間だけ後続ステップを丸ごとスキップし、ジョブを
# 成功として終える（＝メールも notify も出ない）。署名は HTTP 402 と Supabase ホストの
# 名前解決失敗の2つだけで、タイムアウト・5xx・401/403 では止めない。
# **一次信号は別**: site-down-watch.yml（利用者にデータが出ていない）と
# check-collection-heartbeat.yml（収集が止まった）にはゲート自体が無く、必ず鳴る。
# 上流が戻れば次の実行から自動で通常運転に戻る（人手の復旧作業は不要）。
# 手動実行（workflow_dispatch）は止まりません。手で回したときは必ず本体が動きます。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true ならアップロードせずカバレッジのみ表示"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "30 22 * * *"   # 07:30 JST 毎日（スコアリング 06:10 JST の後）

# 最小権限（診断④ 2026-08-20・W-3）: このWFはリポジトリへ書き込まない。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 上流が止まっている間だけ反響を抑えるゲート（2026-09-18 恒久化）────────
      # 実体は scripts/monitor/quota_pause.py。止める条件は「上流が止まっている署名
      # （402 / ホスト名の解決失敗）を観測した」ときだけで、それ以外は必ず paused=false。
      # ゲート自身は常に exit 0（ここでジョブを赤くしない）。
      - name: Quota pause gate
        id: quota_gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # このWFは**反響**側（上流が死んでいれば必ず巻き添えで赤くなる）。解除日に関係なく、
          # 上流が止まっている署名を観測している間は抑制する（2026-09-18 に恒久化）。
          # 一次信号（site-down-watch / check-collection-heartbeat）にはゲート自体が無い。
          QUOTA_GATE_ALWAYS: "1"
          # 日付モード用。QUOTA_GATE_ALWAYS が効いている間は参照されない。
          OPS_QUOTA_PAUSE_UNTIL: ${{ vars.OPS_QUOTA_PAUSE_UNTIL }}
          # 手動実行を絶対に止めないための入力（2026-09-11 追加）。手で回すのは
          # 「今どうなっているか自分の目で確かめたい」ときなので、ここでゲートに
          # 黙ってスキップされると確かめる手段そのものが消える。ゲート側は
          # この値が workflow_dispatch なら無条件で paused=false を返す。
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/monitor/quota_pause.py

      # ここから下は paused=true の間だけスキップされる。空文字（ゲートが落ちた場合）は
      # 'true' ではないので通常どおり実行される＝fail-closed。
      - name: Setup Python
        if: steps.quota_gate.outputs.paused != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 夜タイプ判定(oriental/ml/night_type)の祝日判定に jpholiday が要る。
      # v2.1 の blend50 スケール(グローバルLGBM・当朝に拡大窓で学習)には pandas/numpy/lightgbm
      # が要る（requirements.txt と整合するバージョンをピン。無ければ tonight は自動省略される）。
      - name: Install deps (jpholiday + blend50 LGBM)
        if: steps.quota_gate.outputs.paused != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jpholiday==1.0.3" "numpy==1.26.4" "pandas==2.2.3" "lightgbm==4.5.0"

      # build_templates.py が GITHUB_STEP_SUMMARY にカバレッジ表(店×L/M/H の n_nights と
      # フォールバック)を自分で書くので、ここでの追加配線は不要。
      - name: Build and upload v2 templates
        if: steps.quota_gate.outputs.paused != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORECAST_MODEL_BUCKET: ${{ vars.FORECAST_MODEL_BUCKET }}
          TIMEZONE: Asia/Tokyo
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            python scripts/build_templates.py --dry-run
          else
            python scripts/build_templates.py
          fi

  notify-on-failure:
    needs: [build]
    if: failure()
    uses: ./.github/workflows/notify-on-failure.yml
    secrets: inherit
    with:
      workflow_label: "Build forecast v2 templates"
