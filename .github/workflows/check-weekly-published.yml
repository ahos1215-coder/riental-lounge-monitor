name: Check weekly reports published

# 週次レポート (Windows タスクスケジューラ MEGRIBI-weekly, 毎週水曜 06:30 JST 実行、
# scripts/generate_weekly_insights.py --stores all, INSIGHTS_LLM_BACKEND=ollama) が
# ちゃんと公開されたかを GitHub 側から監視する。日次の check-daily-published.yml と
# 同じ発想: ローカル PC が落ちている / Ollama が固まっている / タスクスケジューラが
# 動かなかった場合、blog_drafts(content_type=weekly, is_published=true) の
# 店舗数が基準を満たさない、または最終更新が古すぎることで検知する。
# 失敗時はジョブが exit 1 する → GitHub が自動でオーナーにメール通知。
# さらに OPS_NOTIFY_WEBHOOK_URL があれば Slack/Discord にも通知する。
#
# 【一時停止ゲート / 2026-09-16 に自動解除】2026-09-11 追加:
# Supabase の無料枠超過（402）が請求リセットまで続くあいだ、この監視は照会自体が失敗して
# 必ず赤になる。そこで先頭に scripts/monitor/quota_pause.py を置き、「2026-09-16 より前」
# かつ「Supabase が実際に 402」の**両方**が成立したときだけ後続ステップをスキップして
# 成功で終える。期限を過ぎたら Supabase が直っていなくても必ず元に戻る（人手の復旧作業は
# 不要）。402 以外・通信失敗・認証情報なしは全部「止めない」側へ倒れる。
# 発火は週1回（木 08:00 JST）なので、実際に黙るのは解除日までに来る1回だけ。
# 手動実行（workflow_dispatch）は止まりません。手で回したときは必ず本体が動きます。

on:
  schedule:
    # 毎週木曜 08:00 JST（= 水曜 23:00 UTC）。水曜 06:30 JST 開始の週次生成が
    # 42 店舗分終わっているのに十分な時間的余裕を見た翌朝。
    - cron: "0 23 * * 3"
  workflow_dispatch:
    inputs:
      min_stores:
        description: "公開済みとみなす最低店舗数の下限フロア（既定38）。既定では下の strict_all_stores=1 が優先し全42店必須"
        required: false
        default: "38"
      max_staleness_days:
        description: "最新更新がこれより古ければ失敗扱い（既定8日 = 先週水曜分が来ていない）"
        required: false
        default: "8"
      allowed_missing_slugs:
        description: "欠落を許す店舗 slug（カンマ区切り。緊急時のGHA生成で相席屋5店が対象外になる場合など。空欄=全店必須）"
        required: false
        default: ""
      strict_all_stores:
        description: "1=全42店必須（既定・推奨） / 0=旧挙動の下限フロア判定に戻す"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  check-published:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      detail: ${{ steps.check.outputs.detail }}
      # 推定原因。スクリプトが「Supabase が 402 を返している」等と特定できたときだけ埋まる。
      # 空のときは notify 側の `||` が従来の固定文にフォールバックする。
      cause: ${{ steps.check.outputs.cause }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Supabase 402 の間だけ黙るゲート（2026-09-16 に自動解除）──────────────
      # paused=true になるのは「解除日より前」かつ「Supabase が実際に 402」の両方が
      # 成立したときだけ。それ以外はすべて paused=false ＝ 従来どおり監視が鳴る。
      # 判定は quota_pause.py 側にあり、このスクリプトは常に exit 0。
      - name: Quota pause gate
        id: quota_gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 未設定なら scripts/monitor/quota_pause.py の既定日（2026-09-16）が使われる。
          OPS_QUOTA_PAUSE_UNTIL: ${{ vars.OPS_QUOTA_PAUSE_UNTIL }}
          # 手動実行を絶対に止めないための入力（2026-09-11 追加）。手で回すのは
          # 「今どうなっているか自分の目で確かめたい」ときなので、ここでゲートに
          # 黙ってスキップされると確かめる手段そのものが消える。ゲート側は
          # この値が workflow_dispatch なら無条件で paused=false を返す。
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/monitor/quota_pause.py

      - name: Query Supabase for latest weekly reports
        id: check
        if: steps.quota_gate.outputs.paused != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIN_STORES: ${{ github.event.inputs.min_stores || '38' }}
          ALLOWED_MISSING_SLUGS: ${{ github.event.inputs.allowed_missing_slugs }}
          STRICT_ALL_STORES: ${{ github.event.inputs.strict_all_stores || '1' }}
          MAX_STALENESS_DAYS: ${{ github.event.inputs.max_staleness_days || '8' }}
        # 判定ロジックの実体は scripts/monitor/check_weekly_published.py（stdlib のみ）。
        # テストは tests/test_monitor_published_checks.py。
        run: python3 scripts/monitor/check_weekly_published.py

  notify:
    needs: [check-published]
    if: failure()
    uses: ./.github/workflows/notify-on-failure.yml
    secrets: inherit
    with:
      workflow_label: "週次レポート未公開チェック"
      # 【2026-09-09 修正】1行目は固定文ではなくスクリプトが特定した原因を優先する。
      # 2026-09-05 の Supabase 402（egress クォータ超過）では「ローカル生成の失敗 / PC停止 /
      # Ollama不調」が3つとも外れで、しかも照会失敗時は detail が空だったため、通知に
      # 本当の原因が一文字も載らなかった。cause が空のときだけ従来の固定文に戻る。
      custom_body: |
        ${{ needs.check-published.outputs.cause || '⚠️ 週次レポートが公開されていない、または古い可能性があります（ローカル生成(MEGRIBI-weekly)の失敗 / PC停止 / Ollama不調）。' }}
        ${{ needs.check-published.outputs.detail }}
