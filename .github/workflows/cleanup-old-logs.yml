name: Cleanup Old Logs

# 毎週日曜 14:00 JST (UTC 日曜 05:00) に自動実行
# （2026-08-18 に旧 UTC 日曜 22:00 から移動。理由は下の schedule: のコメント参照）
# 手動実行も可能（dry_run で確認してから execute）
#
# 安全装置: cleanup_old_logs.py --execute は破壊的（logs テーブルから実データを削除）。
# backup-logs.yml（UTC 日曜 03:00 = JST 日曜 12:00、cleanup の2時間前）がその週の
# バックアップを GitHub Release (logs-backup-YYYYMMDD) として作成する前提で動いているため、
# その週のバックアップが存在しない状態で cleanup が --execute で走ると、
# 「バックアップ失敗週に無防備で削除される」という致命的な穴になる。
# そのため schedule トリガー時は、破壊的な実行の前に「今週のバックアップ Release」の
# 存在を GitHub Releases API で確認し、無ければ --execute を止めて失敗させる
# （notify-on-failure で運用者に通知）。workflow_dispatch の force=true で明示的に
# バイパス可能（バックアップ機構自体のメンテなど、意図的にバイパスしたい運用向け）。
#
# 【2026-09-11 一時措置・日付で自動解除】Supabase が無料枠超過で全リクエストに HTTP 402 を
# 返している間（docs/INCIDENT_2026-09-05_SUPABASE_QUOTA.md）、backup-logs.yml が失敗して
# 「今週のバックアップ Release が無い」→ この check-backup が exit 1 → 失敗メール、という連鎖が起きる。
# そこで両ジョブの先頭に "Quota pause gate" を置き、「解除日より前」かつ「実際に 402」の両方成立時だけ
# 後続ステップを丸ごとスキップしてジョブを成功で終える（＝メールも notify も出ない）。解除日は既定
# 2026-09-16（scripts/monitor/quota_pause.py）で、その日を過ぎたら必ず通常運転に戻る。
# 402 と確認できない場合も必ず通常運転。止めている間は削除も走らないので、データが減ることはない。
# 手動実行（workflow_dispatch）は止まりません。手で回したときは必ず本体が動きます。
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "実行する (false = dry-run で確認のみ)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_rows:
        description: "行数上限 (デフォルト: 3000000)"
        required: false
        default: "3000000"
      force:
        description: "今週のバックアップ確認をバイパスして強制実行する (通常は false のままにする)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # 毎週日曜 14:00 JST = UTC 日曜 05:00（backup-logs.yml の Sun 03:00 UTC の2時間後）
    #
    # 【2026-08-18 変更】旧スケジュールは Sun 22:00 UTC で、週次 ML 学習
    # (train-ml-model.yml の "0 22 * * 0") と完全に同時刻だった。両者が Supabase を
    # 奪い合い、cleanup 側は get_row_count() の count=exact が HTTP 500 で即死していた
    # （2026-08-09 / 08-16 の実行がいずれも約30秒で失敗）。収集ウィンドウ
    # (19:00〜05:00 JST) の外かつ他バッチの無い静かな時間帯へ退避する。
    # backup が Sun 03:00 UTC に完了している前提は下の check-backup ジョブが検証する。
    - cron: "0 5 * * 0"

permissions:
  contents: read

jobs:
  check-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backup_ok: ${{ steps.check.outputs.backup_ok }}
    steps:
      # ゲートは scripts/monitor/quota_pause.py を実行するので checkout が要る
      # （このジョブは元々 checkout していなかった）。
      - name: Checkout
        uses: actions/checkout@v4

      # ── Supabase 402 の間だけアラートを止めるゲート（日付で自動解除）──────────
      # 実体は scripts/monitor/quota_pause.py。止める条件は「解除日より前」かつ
      # 「Supabase が実際に 402」の両方成立時だけで、それ以外は必ず paused=false。
      # ゲート自身は常に exit 0（ここでジョブを赤くしない）。
      - name: Quota pause gate
        id: quota_gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 未設定なら scripts/monitor/quota_pause.py の既定日が使われる。
          OPS_QUOTA_PAUSE_UNTIL: ${{ vars.OPS_QUOTA_PAUSE_UNTIL }}
          # 手動実行を絶対に止めないための入力（2026-09-11 追加）。手で回すのは
          # 「今どうなっているか自分の目で確かめたい」ときなので、ここでゲートに
          # 黙ってスキップされると確かめる手段そのものが消える。ゲート側は
          # この値が workflow_dispatch なら無条件で paused=false を返す。
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/monitor/quota_pause.py

      # ここから下は paused=true の間だけスキップされる。空文字（ゲートが落ちた場合）は
      # 'true' ではないので通常どおり実行される＝fail-closed。
      # スキップされると backup_ok は空文字になる。下の cleanup は BACKUP_OK != "true" を
      # 「破壊的実行をしない」側に読むので、止めた週に誤って削除が走ることはない。
      - name: Verify this week's backup release exists
        if: steps.quota_gate.outputs.paused != 'true'
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            echo "force=true が指定されたため、バックアップ確認をバイパスします。"
            echo "backup_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # backup-logs.yml は STAMP="$(date -u +%Y%m%d)" 実行時刻(UTC 日曜 03:00)で
          # タグ logs-backup-<STAMP> を作成する。cleanup は同じ UTC 日曜の 05:00 に走るため
          # 通常は同一 UTC 日付になるが、GitHub Actions のスケジュール遅延を考慮して
          # 当日 + 前日の2つのタグ候補を許容する（遅延で日付を跨いでも誤検知しないため）。
          TODAY="$(date -u +%Y%m%d)"
          YESTERDAY="$(date -u -d '1 day ago' +%Y%m%d)"

          FOUND=""
          for STAMP in "$TODAY" "$YESTERDAY"; do
            TAG="logs-backup-${STAMP}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/tags/${TAG}")
            echo "checked tag=${TAG} status=${STATUS}"
            if [ "$STATUS" = "200" ]; then
              FOUND="$TAG"
              break
            fi
          done

          if [ -n "$FOUND" ]; then
            echo "今週のバックアップ Release を確認しました: $FOUND"
            echo "backup_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::今週のバックアップ Release (logs-backup-${TODAY} / logs-backup-${YESTERDAY}) が見つかりません。backup-logs.yml が失敗した可能性があります。安全のため destructive な cleanup をスキップします。"
            echo "backup_ok=false" >> "$GITHUB_OUTPUT"
            # workflow_dispatch (dry-run 確認目的等) では失敗させず後続 job 側で execute を止めるだけに留めるが、
            # schedule トリガーではジョブを失敗させて notify-on-failure に伝播させる。
            if [ "$EVENT_NAME" = "schedule" ]; then
              exit 1
            fi
          fi

  cleanup:
    needs: [check-backup]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Supabase 402 の間だけアラートを止めるゲート（日付で自動解除）──────────
      # steps コンテキストはジョブごとに独立しているので、check-backup と同じゲートを
      # このジョブでも1回引く（週次ジョブなので追加リクエストは週2回。無視できる）。
      # 実体は scripts/monitor/quota_pause.py。止める条件は「解除日より前」かつ
      # 「Supabase が実際に 402」の両方成立時だけで、それ以外は必ず paused=false。
      - name: Quota pause gate
        id: quota_gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 未設定なら scripts/monitor/quota_pause.py の既定日が使われる。
          OPS_QUOTA_PAUSE_UNTIL: ${{ vars.OPS_QUOTA_PAUSE_UNTIL }}
          # 手動実行を絶対に止めないための入力（2026-09-11 追加）。手で回すのは
          # 「今どうなっているか自分の目で確かめたい」ときなので、ここでゲートに
          # 黙ってスキップされると確かめる手段そのものが消える。ゲート側は
          # この値が workflow_dispatch なら無条件で paused=false を返す。
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/monitor/quota_pause.py

      # ここから下は paused=true の間だけスキップされる。空文字（ゲートが落ちた場合）は
      # 'true' ではないので通常どおり実行される＝fail-closed。
      - name: Setup Python
        if: steps.quota_gate.outputs.paused != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run cleanup
        if: steps.quota_gate.outputs.paused != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOGS_MAX_ROWS: ${{ github.event.inputs.max_rows || '3000000' }}
          BACKUP_OK: ${{ needs.check-backup.outputs.backup_ok }}
        run: |
          set -euo pipefail
          EXECUTE_FLAG=""
          if [ "${{ github.event.inputs.execute || 'false' }}" = "true" ]; then
            EXECUTE_FLAG="--execute"
          fi
          # schedule トリガーでは自動実行（execute）
          if [ "${{ github.event_name }}" = "schedule" ]; then
            EXECUTE_FLAG="--execute"
          fi

          if [ -n "$EXECUTE_FLAG" ] && [ "$BACKUP_OK" != "true" ]; then
            echo "::error::今週のバックアップが確認できないため、破壊的な cleanup (--execute) をスキップします。dry-run のみ実行します。"
            EXECUTE_FLAG=""
          fi

          python scripts/cleanup_old_logs.py $EXECUTE_FLAG --max-rows "$LOGS_MAX_ROWS"

  notify-on-failure:
    needs: [check-backup, cleanup]
    if: failure()
    uses: ./.github/workflows/notify-on-failure.yml
    secrets: inherit
    with:
      workflow_label: "Cleanup Old Logs"
