name: Check daily reports published

# ローカル(このPCの Ollama。モデル名は scripts/_ollama_common.py の MODEL が正)による
# 日次レポート生成が、その日ちゃんと公開されたかを
# GitHub 側から監視する。PC が落ちている / Ollama が固まっている / ジョブが途中で
# 死んだ場合、当日の blog_drafts(content_type=daily, is_published=true) が欠けるので検知できる。
# 失敗時はジョブが exit 1 する → GitHub が自動でオーナーにメール通知。
# さらに OPS_NOTIFY_WEBHOOK_URL があれば Slack/Discord にも通知する。
#
# carry-over 行との関係（2026-08-19 監査・所見1）:
#   生成に失敗した edition は「前回の良品の本文と target_date」を書き戻す
#   （scripts/local_report_job.py の _apply_carry_over_or_fail）。読者に届けるため
#   error_message は None のままだが、target_date は前日のままなので、下の
#   `target_date=eq.<当日>` の条件で当日分としてはカウントされない
#   ＝ 生成失敗の検知はこれまでどおり効く（読者には前回の良品が出続ける）。
#
# 【一時停止ゲート / 2026-09-16 に自動解除】2026-09-11 追加:
# Supabase の無料枠超過（402）が請求リセットまで続くあいだ、この監視は照会自体が失敗して
# 必ず赤になり、毎日失敗メールが出る。そこで先頭に scripts/monitor/quota_pause.py を置き、
# 「2026-09-16 より前」かつ「Supabase が実際に 402」の**両方**が成立したときだけ後続
# ステップをスキップして成功で終える。期限を過ぎたら Supabase が直っていなくても必ず
# 元に戻る（人手の復旧作業は不要）。402 以外・通信失敗・認証情報なしは全部「止めない」。
# 手動実行（workflow_dispatch）は止まりません。手で回したときは必ず本体が動きます。

on:
  schedule:
    # 毎日 23:30 JST（= 14:30 UTC）。dailyの2エディション(18:00 / 21:30 JST)完了後。
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "チェック対象日 YYYY-MM-DD（空欄=JSTの今日）"
        required: false
        default: ""
      min_published:
        description: "各エディションの最低公開数の下限フロア（既定30）。既定では下の strict_all_stores=1 が優先し全42店必須"
        required: false
        default: "30"
      allowed_missing_slugs:
        description: "欠落を許す店舗 slug（カンマ区切り。緊急時のGHA生成で相席屋5店が対象外になる場合など。空欄=全店必須）"
        required: false
        default: ""
      strict_all_stores:
        description: "1=全42店必須（既定・推奨） / 0=旧挙動の下限フロア判定に戻す"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  check-published:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      detail: ${{ steps.check.outputs.detail }}
      # 推定原因。スクリプトが「Supabase が 402 を返している」等と特定できたときだけ埋まる。
      # 空のときは notify 側の `||` が従来の固定文にフォールバックする。
      cause: ${{ steps.check.outputs.cause }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Supabase 402 の間だけ黙るゲート（2026-09-16 に自動解除）──────────────
      # paused=true になるのは「解除日より前」かつ「Supabase が実際に 402」の両方が
      # 成立したときだけ。それ以外はすべて paused=false ＝ 従来どおり監視が鳴る。
      # 判定は quota_pause.py 側にあり、このスクリプトは常に exit 0。
      - name: Quota pause gate
        id: quota_gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 未設定なら scripts/monitor/quota_pause.py の既定日（2026-09-16）が使われる。
          OPS_QUOTA_PAUSE_UNTIL: ${{ vars.OPS_QUOTA_PAUSE_UNTIL }}
          # 手動実行を絶対に止めないための入力（2026-09-11 追加）。手で回すのは
          # 「今どうなっているか自分の目で確かめたい」ときなので、ここでゲートに
          # 黙ってスキップされると確かめる手段そのものが消える。ゲート側は
          # この値が workflow_dispatch なら無条件で paused=false を返す。
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/monitor/quota_pause.py

      - name: Query Supabase for today's daily reports
        id: check
        if: steps.quota_gate.outputs.paused != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          MIN_PUBLISHED: ${{ github.event.inputs.min_published || '30' }}
          ALLOWED_MISSING_SLUGS: ${{ github.event.inputs.allowed_missing_slugs }}
          STRICT_ALL_STORES: ${{ github.event.inputs.strict_all_stores || '1' }}
        # 判定ロジックの実体は scripts/monitor/check_daily_published.py（stdlib のみ）。
        # テストは tests/test_monitor_published_checks.py。
        run: python3 scripts/monitor/check_daily_published.py

  notify:
    needs: [check-published]
    if: failure()
    uses: ./.github/workflows/notify-on-failure.yml
    secrets: inherit
    with:
      workflow_label: "日次レポート未公開チェック"
      # 【2026-09-09 修正】1行目は固定文ではなくスクリプトが特定した原因を優先する。
      # 2026-09-05 の Supabase 402（egress クォータ超過）では「ローカル生成の失敗 / PC停止 /
      # Ollama不調」が3つとも外れで、しかも照会失敗時は detail が空だったため、通知に
      # 本当の原因が一文字も載らなかった。cause が空のときだけ従来の固定文に戻る。
      custom_body: |
        ${{ needs.check-published.outputs.cause || '⚠️ 日次レポートが公開されていない可能性があります（ローカル生成の失敗 / PC停止 / Ollama不調）。' }}
        ${{ needs.check-published.outputs.detail }}
